spring:
  application:
    name: service-ventas
  config:
    import: configserver:http://localhost:8081
  datasource:
    url: jdbc:mysql://localhost:3306/db_tpf_micro?serverTimezone=UTC
    username: ${db_user}
    password: ${db_pass}
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQL8Dialect

server:
  port: 8084

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka